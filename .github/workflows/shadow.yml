name: Gold Shadow v3.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-shadow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy scikit-learn

      - name: Run shadow bot
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python gold_shadow_v32.py

      - name: Commit results
        run: git config user.name shadow-bot && git config user.email shadow-bot@users.noreply.github.com && (git add shadow_data/ ; git diff --cached --quiet || (git commit -m "shadow update" && git pull --rebase && git push))
